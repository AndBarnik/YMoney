<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b1d4a">
<title>Слияние голов</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b1d4a;font-family:-apple-system,system-ui,Roboto,sans-serif;color:#fff;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#4a3480,#1d1235)}
  #wrap{position:relative}
  canvas{display:block;touch-action:none;border-radius:14px}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,40,.78);border-radius:14px;z-index:5}
  .overlay.show{display:flex}
  .card{background:#fff;color:#2b1d4a;border-radius:20px;padding:22px 24px;text-align:center;width:84%;max-height:92%;overflow:auto}
  .card h2{margin:0 0 6px;font-size:26px}
  .card p{margin:4px 0 14px;font-size:17px}
  button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 22px;background:#ff6b9d;color:#fff;font-size:18px;box-shadow:0 4px 0 #c94577}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #c94577}
  button.sec{background:#7a62c9;box-shadow:0 4px 0 #5a46a0}
  #gear{position:absolute;left:8px;top:8px;width:40px;height:40px;padding:0;font-size:22px;border-radius:50%;z-index:4;background:#7a62c9;box-shadow:0 3px 0 #5a46a0}
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
  .slot{display:flex;align-items:center;gap:8px;background:#f1ecff;border-radius:12px;padding:6px}
  .slot .th{width:46px;height:46px;border-radius:50%;background:#cbbdf5 center/cover;flex:none;border:3px solid #7a62c9;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .slot input[type=text]{width:100%;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:#2b1d4a;user-select:text;-webkit-user-select:text}
  .small{font-size:13px;opacity:.7;margin:0 0 6px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="gear" aria-label="Настройки">⚙️</button>

  <div class="overlay" id="over">
    <div class="card">
      <h2>Игра окончена</h2>
      <p>Счёт: <b id="fs">0</b><br>Рекорд: <b id="fb">0</b></p>
      <button id="again">Ещё раз</button>
    </div>
  </div>

  <div class="overlay" id="settings">
    <div class="card">
      <h2>Головы друзей</h2>
      <p class="small">Нажми на кружок — выбери фото. Снизу вверх: от самой маленькой головы к самой большой.</p>
      <div class="slots" id="slots"></div>
      <button class="sec" id="resetFaces" style="font-size:14px;padding:8px 14px">Сбросить фото</button>
      <button id="closeSet" style="margin-left:6px">Готово</button>
    </div>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>

<script src="faces.js"></script>
<script>
(() => {
'use strict';
// ---------- константы мира ----------
const W = 400, H = 760;
const LEFT = 20, RIGHT = 380, FLOOR = 690, LINE = 150, SPAWN_Y = 100;
const RAD = [16, 23, 30, 38, 47, 57, 68, 80, 93, 107, 122];
const COLORS = ['#ff6b6b','#ff9f43','#feca57','#1dd1a1','#48dbfb','#54a0ff','#5f27cd','#ee5a9b','#a3cb38','#c56cf0','#ffd32a'];
const N = RAD.length;
const G = 1700, SUB = 4;
const MAX_SPAWN = 4; // новые головы появляются с уровнями 0..4

// ---------- лица ----------
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const imgs = new Array(N).fill(null);
const names = [];
function faceName(i){ return store.get('fname'+i) || (window.FACES[i] && window.FACES[i].name) || ('Друг '+(i+1)); }
function loadFace(i){
  const src = store.get('fimg'+i) || (window.FACES[i] && window.FACES[i].src) || '';
  imgs[i] = null;
  if (!src) return;
  const im = new Image();
  im.onload = () => { imgs[i] = im; renderSlots(); };
  im.src = src;
}
for (let i = 0; i < N; i++) loadFace(i);

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1;
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  scale = cv.width / W;
  const wrap = document.getElementById('wrap');
  wrap.style.width = W * s + 'px'; wrap.style.height = H * s + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------- звук ----------
let ac = null;
function beep(freq, dur, type='sine', vol=.15){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e){}
}

// ---------- состояние ----------
let balls, parts, texts, score, best, over, aimX, held, nextLvl, cooldown, dragging, shake;
best = parseInt(store.get('best') || '0', 10) || 0;

function mk(lvl, x, y){
  const r = RAD[lvl];
  return { lvl, x, y, vx:0, vy:0, w:0, ang:(Math.random()-.5)*.6, r, m:r*r, age:0, over:0, pop:0, dead:false };
}
function rndLvl(){ return Math.min(MAX_SPAWN, Math.floor(Math.random() * Math.random() * (MAX_SPAWN + 1.5))); }
function reset(){
  balls = []; parts = []; texts = []; score = 0; over = false; shake = 0;
  aimX = W / 2; dragging = false; cooldown = 0;
  held = rndLvl(); nextLvl = rndLvl();
  document.getElementById('over').classList.remove('show');
}

// ---------- ввод ----------
function worldX(e){
  const rc = cv.getBoundingClientRect();
  return (e.clientX - rc.left) / rc.width * W;
}
function clampAim(x, lvl){ return Math.max(LEFT + RAD[lvl], Math.min(RIGHT - RAD[lvl], x)); }
cv.addEventListener('pointerdown', e => {
  if (over) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  dragging = true; aimX = worldX(e);
  beep(1, .001, 'sine', 0); // разбудить аудио
});
cv.addEventListener('pointermove', e => { if (dragging) aimX = worldX(e); });
function release(){
  if (!dragging) return;
  dragging = false;
  if (over || cooldown > 0 || held == null) return;
  const b = mk(held, clampAim(aimX, held), SPAWN_Y);
  b.vy = 120;
  balls.push(b);
  beep(300 + held * 25, .08, 'triangle', .12);
  held = null; cooldown = .55;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

// ---------- физика ----------
function physics(dt){
  for (const b of balls){
    b.vy += G * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.ang += b.w * dt;
    b.vx *= .9995; b.vy *= .9995; b.w *= .995;
    b.age += dt;
  }
  for (let it = 0; it < 4; it++){
    // пары
    for (let i = 0; i < balls.length; i++){
      const a = balls[i];
      for (let j = i + 1; j < balls.length; j++){
        const b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
        if (dx*dx + dy*dy >= rr*rr) continue;
        let d = Math.sqrt(dx*dx + dy*dy) || .0001;
        const nx = dx / d, ny = dy / d, tx = -ny, ty = nx;
        const ima = 1 / a.m, imb = 1 / b.m, sum = ima + imb;
        const ov = rr - d;
        a.x -= nx * ov * ima / sum * .8; a.y -= ny * ov * ima / sum * .8;
        b.x += nx * ov * imb / sum * .8; b.y += ny * ov * imb / sum * .8;
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        let jn = 0;
        if (vn < 0){
          jn = -(1 + .05) * vn / sum;
          a.vx -= jn * ima * nx; a.vy -= jn * ima * ny;
          b.vx += jn * imb * nx; b.vy += jn * imb * ny;
        }
        // трение + вращение
        const vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty - b.w * b.r - a.w * a.r;
        let jt = -vt / (3 * ima + 3 * imb);
        const lim = .3 * Math.max(jn, 0) + 0.02 * (a.m + b.m) * .001;
        jt = Math.max(-lim, Math.min(lim, jt));
        a.vx -= jt * ima * tx; a.vy -= jt * ima * ty;
        b.vx += jt * imb * tx; b.vy += jt * imb * ty;
        b.w += -b.r * jt / (.5 * b.m * b.r * b.r);
        a.w += -a.r * jt / (.5 * a.m * a.r * a.r);
      }
    }
    // стенки и пол
    for (const b of balls){
      if (b.x < LEFT + b.r){ b.x = LEFT + b.r; if (b.vx < 0) b.vx *= -.05; }
      if (b.x > RIGHT - b.r){ b.x = RIGHT - b.r; if (b.vx > 0) b.vx *= -.05; }
      if (b.y > FLOOR - b.r){
        b.y = FLOOR - b.r;
        if (b.vy > 0) b.vy = b.vy > 120 ? -b.vy * .08 : 0;
        const vt = b.vx - b.w * b.r;
        const dvx = -vt / 3 * .5;
        b.vx += dvx; b.w += -2 * dvx / b.r;
      }
    }
  }
}

function burst(x, y, color, n, speed){
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.283, s = speed * (.4 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .5 + Math.random() * .4, max: .9, color, r: 2 + Math.random() * 4 });
  }
}
function merges(){
  for (let i = 0; i < balls.length; i++){
    const a = balls[i]; if (a.dead) continue;
    for (let j = i + 1; j < balls.length; j++){
      const b = balls[j]; if (b.dead || b.lvl !== a.lvl) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r + .5;
      if (dx*dx + dy*dy > rr*rr) continue;
      a.dead = b.dead = true;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const nl = a.lvl + 1;
      if (nl < N){
        const nb = mk(nl, mx, my);
        nb.vx = (a.vx + b.vx) / 2; nb.vy = (a.vy + b.vy) / 2; nb.w = (a.w + b.w) / 2; nb.ang = a.ang;
        nb.pop = 1; nb.age = 2; balls.push(nb);
        score += nl * (nl + 1) / 2 + 1;
        texts.push({ x: mx, y: my - nb.r, t: faceName(nl), life: 1.1, color: COLORS[nl] });
        burst(mx, my, COLORS[nl], 6 + nl * 2, 160 + nl * 20);
        beep(330 + nl * 70, .18, 'sine', .16);
        if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
        shake = Math.max(shake, nl * .5);
      } else {
        score += 200;
        texts.push({ x: mx, y: my, t: 'МЕГА-СЛИЯНИЕ! +200', life: 1.8, color: '#ffd32a' });
        burst(mx, my, '#ffd32a', 60, 380);
        beep(880, .4, 'square', .12);
      }
      break;
    }
  }
  balls = balls.filter(b => !b.dead);
}

function checkOver(dt){
  let danger = 0;
  for (const b of balls){
    if (b.age > 1 && b.y - b.r < LINE){ b.over += dt; danger = Math.max(danger, b.over); }
    else b.over = 0;
  }
  danger_ = danger;
  if (danger > 2.2) endGame();
}
let danger_ = 0;
function endGame(){
  over = true; dragging = false;
  if (score > best){ best = score; store.set('best', String(best)); }
  document.getElementById('fs').textContent = score;
  document.getElementById('fb').textContent = best;
  document.getElementById('over').classList.add('show');
  beep(160, .6, 'sawtooth', .12);
}

// ---------- отрисовка ----------
function drawHead(c, lvl, x, y, r, ang){
  c.save(); c.translate(x, y); c.rotate(ang);
  const im = imgs[lvl];
  c.beginPath(); c.arc(0, 0, r, 0, 6.2832); c.closePath();
  if (im){
    c.save(); c.clip();
    const s = Math.min(im.width, im.height), sx = (im.width - s) / 2, sy = (im.height - s) / 2;
    c.drawImage(im, sx, sy, s, s, -r, -r, r * 2, r * 2);
    c.restore();
  } else {
    const g = c.createRadialGradient(-r*.3, -r*.3, r*.1, 0, 0, r);
    g.addColorStop(0, '#fff'); g.addColorStop(.25, COLORS[lvl]); g.addColorStop(1, COLORS[lvl]);
    c.fillStyle = g; c.fill();
    // заглушка-лицо
    c.fillStyle = '#2b1d4a';
    const ex = r * .32, ey = -r * .12, er = Math.max(2, r * .09);
    c.beginPath(); c.arc(-ex, ey, er, 0, 6.2832); c.arc(ex, ey, er, 0, 6.2832); c.fill();
    c.strokeStyle = '#2b1d4a'; c.lineWidth = Math.max(1.5, r * .06); c.lineCap = 'round';
    c.beginPath(); c.arc(0, r * .1, r * .38, .25, Math.PI - .25); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.font = '800 ' + Math.max(9, r * .42) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(lvl + 1), 0, -r * .6);
  }
  c.restore();
  c.beginPath(); c.arc(x, y, r - 1.5, 0, 6.2832);
  c.lineWidth = Math.max(2.5, r * .08); c.strokeStyle = COLORS[lvl]; c.stroke();
  c.beginPath(); c.arc(x, y, r, 0, 6.2832);
  c.lineWidth = 1.2; c.strokeStyle = 'rgba(0,0,0,.35)'; c.stroke();
}

function draw(t){
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // фон
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#3b2a6b'); bg.addColorStop(1, '#241649');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  if (shake > .05){ ctx.translate((Math.random()-.5)*shake*2, (Math.random()-.5)*shake*2); }

  // шапка
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.font = '800 34px sans-serif'; ctx.fillText(String(score), W / 2, 42);
  ctx.font = '600 12px sans-serif'; ctx.globalAlpha = .7;
  ctx.fillText('РЕКОРД ' + Math.max(best, score), W / 2, 60); ctx.globalAlpha = 1;
  // следующая голова
  ctx.textAlign = 'right'; ctx.font = '600 11px sans-serif'; ctx.globalAlpha = .7;
  ctx.fillText('ДАЛЬШЕ', W - 14, 24); ctx.globalAlpha = 1;
  drawHead(ctx, nextLvl, W - 30, 50, Math.min(RAD[nextLvl], 22) * 1, 0);

  // стакан
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.fillRect(LEFT, LINE, RIGHT - LEFT, FLOOR - LINE);
  ctx.strokeStyle = '#a58bff'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(LEFT - 3, LINE - 30); ctx.lineTo(LEFT - 3, FLOOR + 3); ctx.lineTo(RIGHT + 3, FLOOR + 3); ctx.lineTo(RIGHT + 3, LINE - 30); ctx.stroke();

  // линия опасности
  const pulse = danger_ > 0 ? .5 + .5 * Math.sin(t / 80) : .35;
  ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(255,90,90,' + (danger_ > 0 ? pulse + .3 : .45) + ')'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(LEFT, LINE); ctx.lineTo(RIGHT, LINE); ctx.stroke(); ctx.setLineDash([]);

  // удерживаемая голова + прицел
  if (!over && held != null){
    const x = clampAim(aimX, held);
    ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, SPAWN_Y + RAD[held]); ctx.lineTo(x, FLOOR); ctx.stroke(); ctx.setLineDash([]);
    drawHead(ctx, held, x, SPAWN_Y, RAD[held], 0);
  }

  // головы
  for (const b of balls){
    let r = b.r;
    if (b.pop > 0){ r *= 1 + Math.sin(b.pop * Math.PI) * .18; }
    drawHead(ctx, b.lvl, b.x, b.y, r, b.ang);
  }

  // частицы и тексты
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = '800 17px sans-serif'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  for (const f of texts){
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.strokeStyle = 'rgba(30,15,60,.9)'; ctx.strokeText(f.t, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.t, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // полоса эволюции
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const sy = 728, step = W / (N + .4), rr = 12;
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(step * .7, sy); ctx.lineTo(W - step * .7, sy); ctx.stroke();
  for (let i = 0; i < N; i++){
    const x = step * (i + .7);
    drawHead(ctx, i, x, sy, rr, 0);
  }
}

// ---------- цикл ----------
let last = 0;
function frame(t){
  const dt = Math.min((t - last) / 1000 || 0, 1 / 30); last = t;
  if (!over){
    for (let i = 0; i < SUB; i++) physics(dt / SUB);
    merges();
    checkOver(dt);
    if (cooldown > 0){
      cooldown -= dt;
      if (cooldown <= 0){ held = nextLvl; nextLvl = rndLvl(); }
    }
  }
  for (const b of balls) if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 4);
  for (const p of parts){ p.life -= dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of texts){ f.life -= dt; f.y -= 28 * dt; }
  texts = texts.filter(f => f.life > 0);
  shake *= .9;
  draw(t);
  requestAnimationFrame(frame);
}

// ---------- настройки / загрузка фото ----------
const slotsEl = document.getElementById('slots');
const fileEl = document.getElementById('file');
let pickIdx = -1;
function renderSlots(){
  if (!slotsEl.offsetParent && !document.getElementById('settings').classList.contains('show')) return;
  slotsEl.innerHTML = '';
  for (let i = N - 1; i >= 0; i--){
    const d = document.createElement('div'); d.className = 'slot';
    const th = document.createElement('div'); th.className = 'th';
    const src = store.get('fimg'+i) || (window.FACES[i] && window.FACES[i].src) || '';
    if (src) th.style.backgroundImage = 'url("' + src + '")'; else { th.textContent = i + 1; th.style.background = COLORS[i]; }
    th.style.borderColor = COLORS[i];
    th.onclick = () => { pickIdx = i; fileEl.value = ''; fileEl.click(); };
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = faceName(i); inp.maxLength = 16;
    inp.oninput = () => store.set('fname'+i, inp.value);
    d.append(th, inp); slotsEl.append(d);
  }
}
fileEl.addEventListener('change', () => {
  const f = fileEl.files && fileEl.files[0]; if (!f || pickIdx < 0) return;
  const idx = pickIdx, url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const s = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = 192;
    c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 192, 192);
    store.set('fimg'+idx, c.toDataURL('image/jpeg', .85));
    URL.revokeObjectURL(url); loadFace(idx); renderSlots();
  };
  im.src = url;
});
document.getElementById('gear').onclick = () => { document.getElementById('settings').classList.add('show'); renderSlots(); };
document.getElementById('closeSet').onclick = () => document.getElementById('settings').classList.remove('show');
document.getElementById('resetFaces').onclick = () => {
  for (let i = 0; i < N; i++){ store.del('fimg'+i); store.del('fname'+i); loadFace(i); }
  renderSlots();
};
document.getElementById('again').onclick = reset;
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
